<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Roteiro de estudo SQL com checklist e progresso local.">
    <title>SQL Estudo | Trilha</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body data-page="trilha">
    <header class="topbar">
      <div>
        <p class="eyebrow">SQL Estudo</p>
        <h1>Trilha</h1>
      </div>
      <nav aria-label="Navegação principal">
        <a href="index.html">Início</a>
        <a href="trilha.html">Trilha</a>
        <a href="laboratorio.html">Laboratório</a>
        <a href="base.html">Base</a>
      </nav>
    </header>

    <main>
      <section class="page-hero" aria-labelledby="trilha-hero-title">
        <p class="eyebrow">Roteiro</p>
        <h2 id="trilha-hero-title">Etapas de estudo</h2>
        <p>
          Marque o avanço por etapa e volte ao laboratório para praticar.
        </p>
      </section>

      <section class="section-band muted" aria-labelledby="mapa-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Mapa de fases</p>
            <h2 id="mapa-title">Sequência do curso</h2>
          </div>
        </div>
        <div id="study-map" class="study-map" aria-live="polite"></div>
      </section>

      <section id="trilha" class="section-band" aria-labelledby="trilha-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Progresso</p>
            <h2 id="trilha-title">Checklist</h2>
          </div>
          <button id="reset-progress" class="ghost-button" type="button">
            Zerar progresso
          </button>
        </div>
        <div id="timeline" class="timeline" aria-live="polite"></div>
      </section>
    </main>

    <footer>
      <span>Estudo prático de SQL com SQLite, Notion, GitHub e Vercel.</span>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
